services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bookstore
      POSTGRES_USER: bookstore
      POSTGRES_PASSWORD: bookstore
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookstore -d bookstore"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
  app:
    build: .
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: bookstore
      PGUSER: bookstore
      PGPASSWORD: bookstore
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./:/app
    command: ["python", "-m", "src.main", "--help"]
volumes:
  postgres_data:
